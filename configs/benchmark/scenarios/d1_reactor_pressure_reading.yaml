scenario_id: d1_reactor_pressure_reading

name: Reactor pressure reading

description: >
  Straightforward (D1) scenario: read the reactor's current pressure and
  compare it to the known high-pressure trip threshold. Answerable from a
  single historian read -- no fault, no multi-source combination required.

difficulty: D1
task_mode: qa

objective: >
  What is the current reactor pressure, and is it within the normal safe
  operating range (below the 3000 kPa high-pressure trip threshold)?

seed: 101
warmup_hours: 1.0
duration_hours: 0.5
sync_interval_hours: 0.25

faults: []

available_architectures:
  - historian

ground_truth:
  conclusion: >
    Reactor pressure is near its nominal closed-loop steady-state value of
    approximately 2705 kPa gauge, well below the 3000 kPa high-pressure
    trip threshold -- the plant is operating normally.
  root_cause_disturbance: null
  affected_measurements: []
  affected_equipment:
    - "urn:icab:equipment:reactor"
  expected_relationships: []
  expected_evidence:
    - "urn:icab:measurement:reactor_pressure"
