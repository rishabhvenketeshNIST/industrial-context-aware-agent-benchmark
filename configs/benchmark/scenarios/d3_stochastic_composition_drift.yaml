scenario_id: d3_stochastic_composition_drift

name: Stochastic stream-4 composition drift -- gradual, historical-reasoning case

description: >
  Temporal/cross-unit (D3) scenario built on M13-B's empirically verified
  idv_08 (Random A/B/C composition of stream 4) -- deliberately selected
  because it is a STOCHASTIC (not step-change) disturbance: its effect
  emerges gradually across the observation window rather than as an
  immediate, obvious step (see the early-vs-late-window analysis in
  docs/architecture/tep-fault-injection.md, e.g. one measurement's
  deviation growing roughly 150x from early- to late-window). A single
  current-value read at any one moment is far less conclusive here than
  it is for a step-type fault (idv_01/idv_02) -- this scenario specifically
  tests whether an agent reasons over the HISTORICAL TREND rather than
  one snapshot.

difficulty: D3
task_mode: diagnosis

objective: >
  Reactor pressure and several related measurements appear to be
  gradually drifting over the past several hours, without an obvious
  single sharp change. Investigate the historical trend (not just the
  current value) to characterize the deviation, and use the knowledge
  graph to confirm the affected equipment.

seed: 107
warmup_hours: 1.0
duration_hours: 4.0
sync_interval_hours: 0.25

faults:
  - disturbance: idv_08
    activate_at_hours: 1.0
    magnitude: 1.0
    description: "Random A/B/C composition of stream 4 (Bathelt/Ricker/Jelali IDV 8)"

available_architectures:
  - historian
  - knowledge_graph

ground_truth:
  conclusion: >
    Reactor pressure, compressor work, purge flow, separator/stripper
    pressure, and several feed/purge composition measurements all drift
    gradually (not in one sharp step) over the four hours following the
    disturbance -- consistent with a stochastic feed-composition
    disturbance (IDV 8) whose effect accumulates rather than jumping
    immediately. The knowledge graph confirms the Reactor equipment (via
    MONITORS) is the entity the pressure measurement belongs to.
  root_cause_disturbance: idv_08
  affected_measurements:
    - "urn:icab:measurement:reactor_pressure"
    - "urn:icab:measurement:compressor_work"
    - "urn:icab:measurement:purge_flow"
    - "urn:icab:measurement:separator_pressure"
    - "urn:icab:measurement:stripper_pressure"
    - "urn:icab:measurement:reactor_cooling_water_outlet_temperature_meas"
    - "urn:icab:measurement:condenser_cooling_water_outlet_temperature"
    - "urn:icab:measurement:feed_a_flow"
    - "urn:icab:measurement:recycle_flow"
    - "urn:icab:measurement:reactor_feed_flow"
    - "urn:icab:measurement:reactor_feed_a_concentration"
    - "urn:icab:measurement:reactor_feed_b_concentration"
    - "urn:icab:measurement:reactor_feed_c_concentration"
    - "urn:icab:measurement:purge_a_concentration"
    - "urn:icab:measurement:purge_b_concentration"
    - "urn:icab:measurement:purge_c_concentration"
  affected_equipment:
    - "urn:icab:equipment:reactor"
    - "urn:icab:equipment:compressor"
    - "urn:icab:equipment:purge-system"
    - "urn:icab:equipment:separator"
    - "urn:icab:equipment:stripper"
    - "urn:icab:equipment:condenser"
    - "urn:icab:equipment:feed-system"
  expected_relationships:
    - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
  expected_evidence:
    - "urn:icab:measurement:reactor_pressure"
