# M13-C tasks against configs/benchmark/scenarios/d1_reactor_pressure_reading.yaml
# (D1, historian only, no fault). D1 tasks are structurally limited to
# C4 (Temporal)/C5 (Operational) dimensions -- the scenario grants ONLY
# `historian`, and no other dimension in icab.tasks.context_dimensions
# is architecturally supportable from historian alone. This is expected
# for "simple/local" tasks, not a gap.

tasks:
  - task_id: d1-qa-current-pressure
    scenario_id: d1_reactor_pressure_reading
    task_type: qa
    difficulty: D1
    objective: >
      What is the current reactor pressure, and is it within the normal
      safe operating range (below the 3000 kPa high-pressure trip
      threshold)?
    available_architectures: [historian]
    required_context_dimensions: [C5]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
    expected_entities:
      - "urn:icab:measurement:reactor_pressure"
    expected_relationships: []
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        Reactor pressure is near its nominal closed-loop steady-state
        value of approximately 2705 kPa gauge, well below the 3000 kPa
        high-pressure trip threshold -- the plant is operating normally.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships: []
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
    evaluation_criteria:
      binding_scores: [required_evidence_score, grounding_score]
      pass_threshold: 1.0
    provenance: "icab.benchmark: derived from d1_reactor_pressure_reading's own ground truth"
    version: "1.0.0"

  - task_id: d1-qa-current-level
    scenario_id: d1_reactor_pressure_reading
    task_type: qa
    difficulty: D1
    objective: "What is the current reactor level?"
    available_architectures: [historian]
    required_context_dimensions: [C5]
    required_evidence:
      - "urn:icab:measurement:reactor_level"
    expected_entities:
      - "urn:icab:measurement:reactor_level"
    expected_relationships: []
    expected_temporal_evidence: false
    ground_truth:
      conclusion: "Reactor level is near its nominal closed-loop steady-state value of approximately 75%."
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships: []
      expected_evidence:
        - "urn:icab:measurement:reactor_level"
    evaluation_criteria:
      binding_scores: [required_evidence_score, grounding_score]
    provenance: "icab.benchmark: single-measurement variant of d1_reactor_pressure_reading"
    version: "1.0.0"

  - task_id: d1-qa-current-temperature
    scenario_id: d1_reactor_pressure_reading
    task_type: qa
    difficulty: D1
    objective: "What is the current reactor temperature?"
    available_architectures: [historian]
    required_context_dimensions: [C5]
    required_evidence:
      - "urn:icab:measurement:reactor_temperature"
    expected_entities:
      - "urn:icab:measurement:reactor_temperature"
    expected_relationships: []
    expected_temporal_evidence: false
    ground_truth:
      conclusion: "Reactor temperature is near its nominal closed-loop steady-state value of approximately 120.4 degC."
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships: []
      expected_evidence:
        - "urn:icab:measurement:reactor_temperature"
    evaluation_criteria:
      binding_scores: [required_evidence_score, grounding_score]
    provenance: "icab.benchmark: single-measurement variant of d1_reactor_pressure_reading"
    version: "1.0.0"

  - task_id: d1-qa-pressure-stability
    scenario_id: d1_reactor_pressure_reading
    task_type: qa
    difficulty: D1
    objective: >
      Has reactor pressure remained stable over the scenario's recorded
      history, or has it moved noticeably?
    available_architectures: [historian]
    required_context_dimensions: [C4]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
    expected_entities:
      - "urn:icab:measurement:reactor_pressure"
    expected_relationships: []
    expected_temporal_evidence: true
    ground_truth:
      conclusion: >
        Reactor pressure has remained stable (no fault is active in this
        scenario) -- historical values stay close to the ~2705 kPa gauge
        nominal level throughout.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships: []
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
    evaluation_criteria:
      binding_scores: [required_evidence_score, grounding_score]
      known_limitations:
        - "The evaluator's temporal_evidence_acquired check only confirms a get_historical_values/i3x_get_history call was made, not that the agent's stability CLAIM matches the retrieved trend's actual shape."
    provenance: "icab.benchmark: temporal variant of d1_reactor_pressure_reading, no new scenario needed"
    version: "1.0.0"

  - task_id: d1-investigation-pressure-and-temperature
    scenario_id: d1_reactor_pressure_reading
    task_type: investigation
    difficulty: D1
    objective: >
      Retrieve the reactor's current pressure and temperature, and state
      whether both appear to be within normal operating ranges.
    available_architectures: [historian]
    required_context_dimensions: [C5]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
      - "urn:icab:measurement:reactor_temperature"
    expected_entities:
      - "urn:icab:measurement:reactor_pressure"
      - "urn:icab:measurement:reactor_temperature"
    expected_relationships: []
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        Reactor pressure (~2705 kPa gauge) and reactor temperature
        (~120.4 degC) are both near their nominal closed-loop
        steady-state values -- normal operation.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships: []
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
        - "urn:icab:measurement:reactor_temperature"
    evaluation_criteria:
      binding_scores: [required_evidence_score, grounding_score, completeness_score]
    provenance: "icab.benchmark: two-measurement variant of d1_reactor_pressure_reading"
    version: "1.0.0"

  - task_id: d1-investigation-pressure-trend
    scenario_id: d1_reactor_pressure_reading
    task_type: investigation
    difficulty: D1
    objective: >
      Retrieve the reactor's current pressure and describe whether it is
      trending in any particular direction based on its recent recorded
      history.
    available_architectures: [historian]
    required_context_dimensions: [C4, C5]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
    expected_entities:
      - "urn:icab:measurement:reactor_pressure"
    expected_relationships: []
    expected_temporal_evidence: true
    ground_truth:
      conclusion: >
        Reactor pressure is stable around ~2705 kPa gauge with no
        directional trend -- no fault is active in this scenario.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships: []
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
    evaluation_criteria:
      binding_scores: [required_evidence_score, grounding_score]
      known_limitations:
        - "Same trend-shape limitation as d1-qa-pressure-stability."
    provenance: "icab.benchmark: temporal+current-value combination variant of d1_reactor_pressure_reading"
    version: "1.0.0"
