# M13-C tasks against configs/benchmark/scenarios/d2_reactor_context_combination.yaml
# (D2, historian + knowledge_graph, no fault).

tasks:
  - task_id: d2ctx-investigation-pressure-level-and-relationship
    scenario_id: d2_reactor_context_combination
    task_type: investigation
    difficulty: D2
    objective: >
      Report the reactor's current pressure and level, and identify which
      piece of equipment monitors the reactor pressure measurement
      according to the knowledge graph.
    available_architectures: [historian, knowledge_graph]
    required_context_dimensions: [C5, C3]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
      - "urn:icab:measurement:reactor_level"
    expected_entities:
      - "urn:icab:measurement:reactor_pressure"
      - "urn:icab:measurement:reactor_level"
      - "urn:icab:equipment:reactor"
    expected_relationships:
      - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        Reactor pressure and level are both near their nominal
        closed-loop steady-state values (~2705 kPa gauge and ~75%
        respectively); the knowledge graph confirms the Reactor
        equipment entity has a MONITORS relationship to the reactor
        pressure measurement.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships:
        - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
        - "urn:icab:measurement:reactor_level"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score, grounding_score, completeness_score]
    provenance: "icab.benchmark: reuses d2_reactor_context_combination's own scenario objective/ground truth verbatim"
    version: "1.0.0"

  - task_id: d2ctx-qa-level-equipment
    scenario_id: d2_reactor_context_combination
    task_type: qa
    difficulty: D2
    objective: >
      Which equipment does the reactor level measurement belong to,
      according to the knowledge graph?
    available_architectures: [historian, knowledge_graph]
    required_context_dimensions: [C3]
    required_evidence: []
    expected_entities:
      - "urn:icab:measurement:reactor_level"
      - "urn:icab:equipment:reactor"
    expected_relationships:
      - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_level"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: "The knowledge graph confirms the Reactor equipment entity MONITORS the reactor level measurement."
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships:
        - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_level"]
      expected_evidence: []
    evaluation_criteria:
      binding_scores: [relationship_score, grounding_score]
      known_limitations:
        - "Purely relational -- no numeric value is required, so required_evidence_score/grounding_score are vacuously satisfied unless the agent fabricates an unsupported number."
    provenance: "icab.benchmark: relational-only variant, isolating C3 from C5"
    version: "1.0.0"

  - task_id: d2ctx-investigation-combine-value-and-relationship
    scenario_id: d2_reactor_context_combination
    task_type: investigation
    difficulty: D2
    objective: >
      Combine the reactor's current pressure reading with its knowledge
      graph relationship to confirm the Reactor is both operating
      normally and correctly identified as the entity that monitors this
      measurement.
    available_architectures: [historian, knowledge_graph]
    required_context_dimensions: [C5, C3]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
    expected_entities:
      - "urn:icab:measurement:reactor_pressure"
      - "urn:icab:equipment:reactor"
    expected_relationships:
      - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        Reactor pressure is near its nominal ~2705 kPa gauge level, and
        the knowledge graph confirms the Reactor equipment entity
        MONITORS this measurement -- both pieces of evidence agree.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships:
        - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score, grounding_score]
    provenance: "icab.benchmark: combination-emphasis variant of d2_reactor_context_combination"
    version: "1.0.0"

  - task_id: d2ctx-qa-monitors-relationship-confirmed
    scenario_id: d2_reactor_context_combination
    task_type: qa
    difficulty: D2
    objective: >
      Does the knowledge graph confirm a MONITORS relationship between
      the Reactor equipment and the reactor pressure measurement?
    available_architectures: [knowledge_graph]
    required_context_dimensions: [C3]
    required_evidence: []
    expected_entities:
      - "urn:icab:equipment:reactor"
      - "urn:icab:measurement:reactor_pressure"
    expected_relationships:
      - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: "Yes -- the knowledge graph confirms the Reactor equipment MONITORS the reactor pressure measurement."
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: ["urn:icab:equipment:reactor"]
      expected_relationships:
        - ["urn:icab:equipment:reactor", "MONITORS", "urn:icab:measurement:reactor_pressure"]
      expected_evidence: []
    evaluation_criteria:
      binding_scores: [relationship_score]
    provenance: "icab.benchmark: knowledge-graph-only variant -- historian intentionally NOT granted, since this question is answerable from the KG alone"
    version: "1.0.0"

  - task_id: d2ctx-qa-cooling-valve-controls-temperature
    scenario_id: d2_reactor_context_combination
    task_type: qa
    difficulty: D2
    objective: >
      Which actuator controls the reactor temperature measurement,
      according to the knowledge graph?
    available_architectures: [knowledge_graph]
    required_context_dimensions: [C6]
    required_evidence: []
    expected_entities:
      - "urn:icab:actuator:reactor_cooling_water_valve"
      - "urn:icab:measurement:reactor_temperature"
    expected_relationships:
      - ["urn:icab:actuator:reactor_cooling_water_valve", "CONTROLS", "urn:icab:measurement:reactor_temperature"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        The reactor cooling water valve CONTROLS the reactor temperature
        measurement, per the real decentralized control-loop registry
        (M13-A/M13-B: tep_studio.control.registry.RICKER_MODE1) the
        knowledge graph's CONTROLS relationship is sourced from.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: []
      expected_relationships:
        - ["urn:icab:actuator:reactor_cooling_water_valve", "CONTROLS", "urn:icab:measurement:reactor_temperature"]
      expected_evidence: []
    evaluation_criteria:
      binding_scores: [relationship_score]
      known_limitations:
        - "This is a static, process-control-registry fact (not scenario/fault-dependent) -- it holds identically regardless of which fault, if any, is active. Included specifically to exercise C6 (Procedural), which no other task in this initial suite does."
    provenance: "icab.benchmark: C6-Procedural coverage task, sourced from icab.tep.measurements.real_control_loop_pairs (M13-A)"
    version: "1.0.0"
