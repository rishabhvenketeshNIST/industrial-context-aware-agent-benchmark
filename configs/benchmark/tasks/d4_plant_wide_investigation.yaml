# M13-C tasks against configs/benchmark/scenarios/d4_plant_wide_investigation.yaml
# (D4, full architecture set, idv_06 -- the M13-B flagship "affected
# equipment not obvious from local/reactor measurements" fault).

tasks:
  - task_id: d4plant-investigation-open-ended
    scenario_id: d4_plant_wide_investigation
    task_type: investigation
    difficulty: D4
    objective: >
      Operators report the plant is behaving abnormally, but no specific
      cause or location has been identified. Investigate across the
      process -- discover what equipment and measurements exist, check
      for deviations, and determine which equipment is actually affected
      and why.
    available_architectures: [historian, knowledge_graph, uns, opcua, mqtt]
    required_context_dimensions: [C1, C2, C3, C4, C5]
    required_evidence:
      - "urn:icab:measurement:stripper_level"
      - "urn:icab:measurement:compressor_work"
    expected_entities:
      - "urn:icab:equipment:stripper"
      - "urn:icab:equipment:compressor"
      - "urn:icab:equipment:separator"
      - "urn:icab:equipment:condenser"
    expected_relationships:
      - ["urn:icab:equipment:stripper", "MONITORS", "urn:icab:measurement:stripper_level"]
      - ["urn:icab:equipment:compressor", "MONITORS", "urn:icab:measurement:compressor_work"]
    expected_temporal_evidence: true
    ground_truth:
      conclusion: >
        Feed component A is lost (IDV 6). This does not primarily disturb
        the reactor -- its pressure, level, and temperature all stay
        close to normal -- but produces large deviations further
        downstream: compressor work drops substantially, stripper level
        and temperature drop sharply, separator temperature drops, and
        condenser cooling water outlet temperature drops. The Stripper,
        Compressor, Separator, and Condenser are the affected equipment,
        not the Reactor.
      root_cause_disturbance: idv_06
      affected_measurements:
        - "urn:icab:measurement:stripper_level"
        - "urn:icab:measurement:stripper_temperature"
        - "urn:icab:measurement:compressor_work"
        - "urn:icab:measurement:condenser_cooling_water_outlet_temperature"
        - "urn:icab:measurement:separator_temperature"
      affected_equipment:
        - "urn:icab:equipment:stripper"
        - "urn:icab:equipment:compressor"
        - "urn:icab:equipment:separator"
        - "urn:icab:equipment:condenser"
      expected_relationships:
        - ["urn:icab:equipment:stripper", "MONITORS", "urn:icab:measurement:stripper_level"]
        - ["urn:icab:equipment:compressor", "MONITORS", "urn:icab:measurement:compressor_work"]
      expected_evidence:
        - "urn:icab:measurement:stripper_level"
        - "urn:icab:measurement:compressor_work"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score, conclusion_correctness_score, grounding_score, completeness_score]
      known_limitations:
        - "conclusion_correctness_score checks whether the ground truth's affected assets are mentioned, not that the agent correctly reasoned 'the reactor is NOT the cause despite being the obvious first guess' -- see docs/benchmark/evaluation.md."
    provenance: "icab.benchmark: reuses d4_plant_wide_investigation's own scenario objective/ground truth verbatim"
    version: "1.0.0"

  - task_id: d4plant-diagnosis-reactor-vs-downstream
    scenario_id: d4_plant_wide_investigation
    task_type: diagnosis
    difficulty: D4
    objective: >
      Confirm whether the reactor itself is the primary location of the
      abnormality, or whether the effect is stronger elsewhere in the
      plant.
    available_architectures: [historian, knowledge_graph]
    required_context_dimensions: [C4, C3]
    required_evidence:
      - "urn:icab:measurement:reactor_pressure"
      - "urn:icab:measurement:stripper_level"
    expected_entities:
      - "urn:icab:equipment:reactor"
      - "urn:icab:equipment:stripper"
    expected_relationships:
      - ["urn:icab:equipment:stripper", "MONITORS", "urn:icab:measurement:stripper_level"]
    expected_temporal_evidence: true
    ground_truth:
      conclusion: >
        The reactor's own measurements (pressure/level/temperature) stay
        close to normal; the Stripper (and Compressor, Separator,
        Condenser) show the real, much larger deviation. The effect is
        stronger downstream, not at the reactor.
      root_cause_disturbance: idv_06
      affected_measurements:
        - "urn:icab:measurement:stripper_level"
      affected_equipment:
        - "urn:icab:equipment:stripper"
      expected_relationships:
        - ["urn:icab:equipment:stripper", "MONITORS", "urn:icab:measurement:stripper_level"]
      expected_evidence:
        - "urn:icab:measurement:reactor_pressure"
        - "urn:icab:measurement:stripper_level"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score, conclusion_correctness_score, grounding_score]
      known_limitations:
        - "The evaluator checks that reactor_pressure was retrieved (required_evidence) and that 'stripper' is mentioned (conclusion_correctness_score's affected-asset check) -- it does not independently verify a COMPARATIVE claim ('stronger downstream than at the reactor')."
    provenance: "icab.benchmark: contrastive 'weak local vs strong downstream' framing of d4_plant_wide_investigation"
    version: "1.0.0"

  - task_id: d4plant-qa-discover-equipment
    scenario_id: d4_plant_wide_investigation
    task_type: qa
    difficulty: D4
    objective: >
      Before checking for any deviation, discover what equipment exists
      in this plant (via UNS or OPC UA browsing).
    available_architectures: [uns, opcua]
    required_context_dimensions: [C1, C2]
    required_evidence: []
    expected_entities:
      - "urn:icab:equipment:reactor"
      - "urn:icab:equipment:separator"
      - "urn:icab:equipment:stripper"
      - "urn:icab:equipment:compressor"
      - "urn:icab:equipment:condenser"
    expected_relationships: []
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        The plant includes (at least) Reactor, Condenser, Separator,
        Stripper, Compressor, Purge System, and Feed System equipment,
        discoverable via UNS/OPC UA browsing.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: []
      expected_relationships: []
      expected_evidence: []
    evaluation_criteria:
      binding_scores: [grounding_score, completeness_score]
      known_limitations:
        - "This task deliberately grants NO historian/knowledge_graph access -- it tests discoverability (C1/C2) in isolation from value retrieval/relational reasoning, per the M13-C direction to distinguish 'local context from hierarchy discovery.'"
    provenance: "icab.benchmark: discovery-only isolation task, testing C1/C2 without C3/C5"
    version: "1.0.0"

  - task_id: d4plant-investigation-selective-retrieval
    scenario_id: d4_plant_wide_investigation
    task_type: investigation
    difficulty: D4
    objective: >
      Selectively retrieve only the measurements needed to confirm which
      equipment is abnormal, rather than reading every available value.
    available_architectures: [historian, knowledge_graph, uns, opcua, mqtt]
    required_context_dimensions: [C3, C4, C5]
    required_evidence:
      - "urn:icab:measurement:stripper_level"
      - "urn:icab:measurement:compressor_work"
    expected_entities:
      - "urn:icab:equipment:stripper"
      - "urn:icab:equipment:compressor"
    expected_relationships:
      - ["urn:icab:equipment:stripper", "MONITORS", "urn:icab:measurement:stripper_level"]
    expected_temporal_evidence: true
    ground_truth:
      conclusion: >
        Stripper level and compressor work are the clearest, most
        efficient evidence of the abnormality -- the Stripper and
        Compressor are the affected equipment.
      root_cause_disturbance: idv_06
      affected_measurements:
        - "urn:icab:measurement:stripper_level"
        - "urn:icab:measurement:compressor_work"
      affected_equipment:
        - "urn:icab:equipment:stripper"
        - "urn:icab:equipment:compressor"
      expected_relationships:
        - ["urn:icab:equipment:stripper", "MONITORS", "urn:icab:measurement:stripper_level"]
      expected_evidence:
        - "urn:icab:measurement:stripper_level"
        - "urn:icab:measurement:compressor_work"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score, grounding_score]
      known_limitations:
        - "'Selective retrieval' efficiency itself is NOT a binding score here (none of the six known score fields measure redundancy/tool-call economy) -- it is tracked post-hoc via icab.evaluation.information_flow.InformationFlowReport.redundant_acquisition_count on the ExperimentRecord, not gated as a pass/fail criterion by this task. See docs/benchmark/evaluation.md."
    provenance: "icab.benchmark: efficiency-emphasis framing of d4_plant_wide_investigation, testing selective vs exhaustive retrieval"
    version: "1.0.0"
