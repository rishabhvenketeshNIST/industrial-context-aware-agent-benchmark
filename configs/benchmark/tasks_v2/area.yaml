# ICAB v2: hand-authored Area-level tasks (NOT derived from tep-v1 --
# tep-v1 has no Area-level tasks at all). Real, verified hierarchy facts
# from icab.tep.adapter.TEPAdapter.get_hierarchy_relationships() --
# see configs/usecases/area.yaml for why these are deliberately thin.

tasks:
  - task_id: area-qa-site-membership
    scenario_id: d2_reactor_context_combination
    task_type: qa
    difficulty: D1
    isa95_level: area
    use_case_id: area-site-membership-identification
    objective: >
      Which site does the Reaction Area process area belong to?
    available_architectures: [knowledge_graph]
    required_context_dimensions: [C2, C3]
    required_evidence:
      - "urn:icab:site:tep"
    expected_entities:
      - "urn:icab:area:reaction"
      - "urn:icab:site:tep"
    expected_relationships:
      - ["urn:icab:area:reaction", "PART_OF", "urn:icab:site:tep"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        The Reaction Area (urn:icab:area:reaction) is part of the
        Tennessee Eastman Process site (urn:icab:site:tep).
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment: []
      expected_relationships:
        - ["urn:icab:area:reaction", "PART_OF", "urn:icab:site:tep"]
      expected_evidence:
        - "urn:icab:site:tep"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score]
      pass_threshold: 1.0
    provenance: "icab.usecases: area-site-membership-identification (new, ICAB v2)"
    version: "1.0.0"

  - task_id: area-investigation-process-cell-composition
    scenario_id: d2_reactor_context_combination
    task_type: investigation
    difficulty: D2
    isa95_level: area
    use_case_id: area-process-cell-composition
    objective: >
      Which process cell operates within the Reaction Area, and what
      equipment does it contain?
    available_architectures: [knowledge_graph]
    required_context_dimensions: [C2, C3]
    required_evidence:
      - "urn:icab:processcell:reaction"
    expected_entities:
      - "urn:icab:processcell:reaction"
      - "urn:icab:equipment:reactor"
    expected_relationships:
      - ["urn:icab:processcell:reaction", "PART_OF", "urn:icab:area:reaction"]
      - ["urn:icab:equipment:reactor", "PART_OF", "urn:icab:processcell:reaction"]
    expected_temporal_evidence: false
    ground_truth:
      conclusion: >
        The Reaction Process Cell (urn:icab:processcell:reaction)
        operates within the Reaction Area, and contains the plant's
        equipment, including the Reactor.
      root_cause_disturbance: null
      affected_measurements: []
      affected_equipment:
        - "urn:icab:equipment:reactor"
      expected_relationships:
        - ["urn:icab:processcell:reaction", "PART_OF", "urn:icab:area:reaction"]
        - ["urn:icab:equipment:reactor", "PART_OF", "urn:icab:processcell:reaction"]
      expected_evidence:
        - "urn:icab:processcell:reaction"
    evaluation_criteria:
      binding_scores: [required_evidence_score, relationship_score, completeness_score]
      pass_threshold: 1.0
    provenance: "icab.usecases: area-process-cell-composition (new, ICAB v2)"
    version: "1.0.0"
