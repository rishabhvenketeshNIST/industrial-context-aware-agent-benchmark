use_cases:
- use_case_id: area-site-membership-identification
  name: Identify the site an area belongs to
  description: 'Identify which site the process area is part of -- a single, real
    PART_OF hierarchy fact (Area -> Site), not scenario-varying.

    '
  isa95_level: area
  task_type: qa
  required_context:
  - C2
  - C3
  candidate_context:
  - C2
  - C3
  success_criteria:
    binding_scores:
    - required_evidence_score
    - relationship_score
    pass_threshold: 1.0
  applicable_scenarios:
  - d2_reactor_context_combination
  difficulty: D1
- use_case_id: area-process-cell-composition
  name: Identify the process cell(s) and equipment within an area
  description: 'Identify which process cell(s) operate within the area, and which
    equipment those process cells contain -- a real, two-level PART_OF chain (ProcessCell
    -> Area, Equipment -> ProcessCell), not scenario-varying.

    '
  isa95_level: area
  task_type: investigation
  required_context:
  - C2
  - C3
  candidate_context:
  - C2
  - C3
  - C1
  success_criteria:
    binding_scores:
    - required_evidence_score
    - relationship_score
    - completeness_score
    pass_threshold: 1.0
  applicable_scenarios:
  - d2_reactor_context_combination
  difficulty: D2
- use_case_id: area-cross-comparison
  name: Compare KPIs across areas
  description: Compare a specific KPI across two areas to determine which one performs
    better on it.
  isa95_level: area
  task_type: investigation
  required_context: &id001
