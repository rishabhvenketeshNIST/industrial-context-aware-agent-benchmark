use_cases:
- use_case_id: work-center-area-membership
  name: Confirm work-center-to-area membership
  description: Confirm which area a given work center belongs to.
  isa95_level: work_center
  task_type: qa
  required_context: &id001
  - C2
  - C3
  candidate_context: *id001
  success_criteria:
    binding_scores:
    - relationship_score
    - required_evidence_score
    pass_threshold: 1.0
  applicable_scenarios:
